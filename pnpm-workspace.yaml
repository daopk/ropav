packages:
  - "packages/*"

catalog:
  "@tailwindcss/cli": 4.3.3
  "@tailwindcss/postcss": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 26.6.2
  "@vitejs/plugin-vue": 6.0.9
  "@vitest/browser": 5.0.1
  "@vitest/browser-playwright": 5.0.1
  "@vue/compiler-vapor": 3.6.0-rc.9
  lightningcss: 1.33.0
  playwright: 1.63.0
  tailwindcss: 4.3.3
  typescript: npm:typescript-native-bridge@6.0.3-bridge.17.tsgo.7.0.2
  unplugin-icons: 24.0.0
  vite: 8.3.0
  vitest: 5.0.1
  vue: 3.6.0-rc.9
  vue-component-meta: 3.3.11
  vue-tsc: 3.3.11

overrides:
  # `vitepress` declares `vue: ^3.5.41` as a hard dependency, and a prerelease does not
  # satisfy that range, so pnpm would install a second Vue beside the Vapor one. Nothing
  # else in the graph asks for a different Vue, so this is a no-op everywhere else.
  vue: "catalog:"

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
